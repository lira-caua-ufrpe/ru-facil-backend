version: '3.8'

services:

  # ── 1. Service Discovery (Eureka) ──────────────────────────────────────────
  service-discovery:
    build: ./service-discovery
    container_name: rufacil-eureka
    ports:
      - "8761:8761"
    networks:
      - rufacil-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 2. Serviço de Pagamento e Faturamento ──────────────────────────────────
  servico-pagamento:
    build: ./servico-pagamento-faturamento
    container_name: rufacil-pagamento
    ports:
      - "8082:8082"
    networks:
      - rufacil-network
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/

  # ── 3. Serviço de Refeição e Reserva ──────────────────────────────────────
  servico-reserva:
    build: ./servico-refeicao-reserva
    container_name: rufacil-reserva
    ports:
      - "8081:8081"
    networks:
      - rufacil-network
    depends_on:
      service-discovery:
        condition: service_healthy
      servico-pagamento:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/

  # ── 4. API Gateway ─────────────────────────────────────────────────────────
  api-gateway:
    build: ./API-Gateway
    container_name: rufacil-gateway
    ports:
      - "8080:8080"
    networks:
      - rufacil-network
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/

  # ── 5. Serviço de Catraca ──────────────────────────────────────────────────
  servico-catraca:
    build: ./servico-catraca
    container_name: rufacil-catraca
    ports:
      - "8083:8083"
    networks:
      - rufacil-network
    depends_on:
      service-discovery:
        condition: service_healthy
      servico-reserva:
        condition: service_started
      servico-pagamento:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/

  # ── 6. Serviço de Acesso ───────────────────────────────────────────────────
  servico-acesso:
    build: ./servico-acesso
    container_name: rufacil-acesso
    ports:
      - "8084:8084"
    networks:
      - rufacil-network
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/

networks:
  rufacil-network:
    driver: bridge
